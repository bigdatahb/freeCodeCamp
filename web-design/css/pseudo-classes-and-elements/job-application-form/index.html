<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form>
            <label for="name">Name: </label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
            <label for="position">Position: </label>
            <select id="position" name="position">
                <option value="select a position">Select a position</option>
                <option value="Data Engineer">Data Engineer</option>
                <option value="Web Developer">Web Developer</option>
                <option value="AI Builder">AI Builder</option>
            </select>
            <fieldset class="radio-group" id="radio-group">
                <legend>Availability</legend>
                
                <input type="radio" name="availability" id="fulltime" value="fulltime" checked>
                <label for="fulltime" class="availability">Fulltime</label>
                
                <input type="radio" name="availability" id="parttime" value="parttime">
                <label for="parttime"  class="availability">Parttime</label>
            </fieldset>
            <label for="message">Why do you want this job?</label>
            <textarea id="message" required></textarea>

            <button type="submit" id="submit-btn">Submit</button>
        </form>
    </div>
</body>
</html>
