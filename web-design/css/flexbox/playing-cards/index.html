<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">
    <div class="card black">
      <div class="left">
        <p>2</p>
        <p>♠</p>
      </div>
      <div class="middle">
        <p>♠</p>
        <p class="reverse">♠</p>
      </div>
      <div class="right reverse">
        <p>2</p>
        <p>♠</p>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <p>A</p>
        <p>♥</p>
      </div>
      <div class="middle">
        <p>♥</p>
      </div>
      <div class="right reverse">
        <p>A</p>
        <p>♥</p>
      </div>
    </div>
    <div class="card red">
      <div class="left">
        <p>5</p>
        <p>♦</p>
      </div>
      <div class="middle">
        <p>♦♦</p>
        <p>♦</p>
        <p>♦♦</p>
      </div>
      <div class="right reverse">
        <p>5</p>
        <p>♦</p>
      </div>
    </div>
  </main>
</body>

</html>
