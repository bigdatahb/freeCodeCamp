<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Book Inventory</h1>
  </header>
  <main>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Category</th>
          <th>Status</th>
          <th>Rate</th>
        </tr>
      </thead>
      <tbody>
        <tr class="read">
          <td>天龙八部</td>
          <td>金庸</td>
          <td>武侠</td>
          <td>
            <span class="status">Read</span>
          </td>
          <td>
            <span class="rate three">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

        <tr class="to-read">
          <td>楚留香传奇</td>
          <td>古龙</td>
          <td>武侠</td>
          <td>
            <span class="status">To Read</span>
          </td>
          <td>
            <span class="rate two">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>

        <tr class="in-progress">
          <td>遮天</td>
          <td>辰东</td>
          <td>仙幻</td>
          <td>
            <span class="status">In Progress</span>
          </td>
          <td>
            <span class="rate one">
              <span></span>
              <span></span>
              <span></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>

</html>
