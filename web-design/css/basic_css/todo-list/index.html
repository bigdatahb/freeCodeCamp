<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="t1" name="t1">
            <label for="t1">Learning web design</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">Go to freeCodeCamp</a>
                </li>
            </ul>
        </li>

         <li>
            <input type="checkbox" id="t2" name="t2">
            <label for="t2">Learning cpp</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.learncpp.com/" target="_blank">Go to learncpp.com</a>
                </li>
            </ul>
        </li>

         <li>
            <input type="checkbox" id="t3" name="t3">
            <label for="t3">Play basketball</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">View places where you can play basketball</a>
                </li>
            </ul>
        </li>

         <li>
            <input type="checkbox" id="t4" name="t4">
            <label for="t4">Swimming</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org/learn" target="_blank">Buy Swim Trunks</a>
                </li>
            </ul>
        </li>
    </ul>
</body>

</html>
