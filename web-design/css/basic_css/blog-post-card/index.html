<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="A computor on desk">

        <div class="post-content">
            <h2 class="post-title">Relational Database Course</h2>
            <p class="post-excerpt">介绍了关系型数据库的基本概念，包括 PostgreSQL 的使用；Shell脚本的编写；Git相关知识</p>
            <a class="read-more" href="https://www.freecodecamp.com">Read More</a>
        </div>
    </div>
</body>
</html>
