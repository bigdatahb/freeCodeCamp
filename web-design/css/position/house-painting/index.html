<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Painting</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="house">
        <div id="chimney">
            <div class="smoke"></div>
            <div class="chimney-divider cd1"></div>
            <div class="chimney-divider cd2"></div>
            <div class="chimney-divider cd3"></div>
        </div>
        <div id="roof">
            <div class="tiles">
                <div class="tile-left">
                    <div class="tile t1"></div>
                    <div class="tile t2"></div>
                </div>
                <div class="tile-right">
                    <div class="vertical-tile v1"></div>
                    <div class="vertical-tile v2"></div>
                    <div class="vertical-tile v3"></div>
                    <div class="vertical-tile"></div>
                </div>
            </div>
        </div>
        <div id="window-1">
            <div class="window-divider"></div>
        </div>
        <div id="window-2">
            <div class="window-divider"></div>
        </div>
        <div id="door">
            <div class="door-handle"></div>
            <div class="welcome">
        <span class="welcome-text">WELCOME</span></div>
        </div>
    </div>
    <div class="ground"></div>
    
</body>
</html>
