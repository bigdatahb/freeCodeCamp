<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<title>freeCodeCamp</title>
		<!--
		SEO: Search Engine Optimization, 搜索引擎优化
			是一种优化网页以提高其在搜索引擎中的可见度和排名的实践

			提升网站 SEO 的一种简单方式就是使用 <meta> 为网页添加简短的描述
		-->
		<meta name="description" content="Discover expert tips and techniques for gardening in small spaces, choosing the right plants, and maintaining a thriving garden.">

		<!-- 通过 Open Graph 标签来优化 SEO 
			open graph 最重要的 4 个属性: title, type, image, url
				其他属性； description, audio, video, locale
		-->
		<!-- 空元素最后的 / 没有任何作用, 只不过有些 IDE 在格式化代码的时候会自动为空元素添加上 / -->
		<meta content="freeCodeCamp.org" property="og:title" />
		<meta property="og:type" content="website" />
		<meta content="https://cdn.freecodecamp.org/platform/universal/fcc_meta_1920X1080-indigo.png" property="og:image"/>
		<meta property="og:url" content="https://www.freecodecamp.org" />
	</head>
	<body>

	</body>
</html>
