<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
      <h1 id="title">Survey Form</h1>
      <p id="description">Thank you for taking the time to help us complete the survey.</p>
    </header>
    <main>
      <form id="survey-form">
        <label for="name" id="name-label">Name:</label>
        <input type="text" id="name" name="name" placeholder="e.g. Alex" required>
        <label for="email" id="email-label">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <label for="number" id="number-label">Phone:</label>
        <input type="number" id="number" name="number" placeholder="5555555555" min="8" max="13">
        <label for="gender">Gender:</label>
        <select name="gender" id="dropdown">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>

        <p>What is your most common mode of transportation when you travel?</p>
        <label for="plane">Plane</label>
        <input type="radio" name="transpot" value="plane" id="plane">
        <label for="train">Train</label>
        <input type="radio" name="transpot" value="train" id="train">
        <label for="bus">Bus</label>
        <input type="radio" name="transpot" value="bus" id="bus" checked>
        <label for="other">Other</label>
        <input type="radio" name="transpot" value="other" id="other">

        <p>What are your hobbies and interests?</p>
        <label for="climing">Climing</label>
        <input type="checkbox" name="hobbies" value="climing" id="climing">
        <label for="swimming">Swimming</label>
        <input type="checkbox" name="hobbies" value="swimming" id="swimming">
        <label for="running">Running</label>
        <input type="checkbox" name="hobbies" value="running" id="running">
        <label for="reading">Reading</label>
        <input type="checkbox" name="hobbies" value="reading" id="reading">
        <label for="watching-movies">Watching Movies</label>
        <input type="checkbox" name="hobbies" value="watching-movies" id="watching-movies">

        <p>Do you have any other suggestions for us?</p>
        <textarea cols="30" rows="5" name="comments" id="comments"></textarea>
        <button type="submit" id="submit">Submit</button>
      </form>

    </main>
    <footer></footer>
  </body>
</html>
