<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Play list</h1>
  <section>
    <h2>Sailing away</h2>
    <audio controls aria-label="a song named sailing away">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
    </audio>
  </section>
  <section>
    <h2>What is the map method and how does it work</h2>
    <video controls aria-label="a mp4 video introducing the map method" width="400">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">

      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="captions" srclang="english" label="english"></track>
    </video>
  </section>
  <section>
    <h2>Transcript</h2>
    <p>
      [Speaker 1]: What is the map method and how does it work?
    </p>
  </section>
</body>

</html>
