<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A Rubik's cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name"><span aria-hidden="true">*</span>Card name</label>
            <input id="card-name" name="card-name" type="text" required>
            
            <label for="card-number"><span aria-hidden="true">*</span>Card number</label>
            <input type="text" id="card-number" name="card-number" required aria-describedby="card-number-help">
            <p id="card-number-help">Please enter an 8-digit card number</p>
        </form>
    </section>
</body>

</html>
