	<head>

		<title>freeCodeCamp</title>

	<body>
		<!--
			<a> 可以创建超链接，它有一个 target 属性, target 属性告诉浏览器应该在哪里打开 <a> 指定的 URL
			
			target 有 4 个常见的取值:

			- `_self`, 默认值，在当前浏览上下文中（当前标签页或窗口）打开链接
			- `_blank`, 在新的浏览器环境中打开链接，可能是新窗口，也可能是新标签页，根据用户浏览器配置来
			- `_parent`, 在当前上下文的父级元素中打开链接
			- `_top`，在最顶层的浏览器上下文中打开链接。始终在完整的浏览器标签页或窗口中打开

			链接状态:

			- `:link`: 表示用户尚未访问、点击或与之交互
			- `:visited`: 表示用户已经访问过链接指向的页面
			- `:hover`: 当用户将鼠标悬停在链接上时，此状态生效
			- `:focus`: 当焦点落在链接上时，就会应用此状态
			- `:active`: 正在点击时的状态

			使用这些状态来设置链接样式时，需要按照特定的顺序进行编写：`:link`,  `:visited`, `:hover`, `:focus`, `:active`

		-->

	</body>
</html>
