    <main>
      <h1>麻婆豆腐</h1>
      <p>这是一道老少皆宜的川菜</p>
      <h2>Ingredients</h2>
      <ul>
        <li>豆腐</li>
        <li>牛肉</li>
        <li>豆瓣酱</li>
        <li>花椒</li>
      </ul>
      <h2>Instructions</h2>
      <ol>
        <li>将豆腐切成方块，冷水下锅，水里放一点食盐，水开烧2-3分钟</li>
        <li>将豆腐捞出控水</li>
        <li>牛肉切成肉酱，花椒碾成粉末</li>
        <li>锅热倒油，油热倒入牛肉末进行煸炒，炒香后加入豆瓣酱继续翻炒，将豆瓣酱的颜色炒出来，加适量酱油、老抽和食盐，加水烧开</li>
        <li>放入豆腐，煮2分钟左右，准备淀粉水进行勾芡，做2-3次勾芡，勾芡好之后出锅，撒上花椒粉</li>
      </ol>
